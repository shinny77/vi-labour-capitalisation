function destroyCharts(){Object.values(charts).forEach(c=>{try{c.destroy()}catch(e){}});for(let k in charts)delete charts[k]}
function badge(p){return NEW.includes(p)?'<span class="badge">NEW</span>':''}
function barSplit(cap,noncap,leave){
  const t=cap+noncap+leave;if(t===0)return'<div class="bar"><div class="g" style="width:100%"></div></div>';

function setTab(t){state.tab=t;state.drill=null;state.search='';render()}

function buildFilters(){
  const fb=document.getElementById('fltBar');
  const needMonth=true,needPerson=['overview','pillars'].includes(state.tab),needType=['overview'].includes(state.tab),needSearch=['projects'].includes(state.tab)&&!state.drill;
  let h='<select id="fM"><option value="">All Months</option>';
  months.forEach(m=>{h+=`<option value="${m}"${state.month===m?' selected':''}>${m}</option>`});
  h+='</select>';
  h+='<label style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--tx2);cursor:pointer;background:var(--sf);border:1px solid var(--sf2);padding:4px 10px;border-radius:6px"><input type="checkbox" id="fSens"'+(state.hideSens?' checked':'')+' style="accent-color:var(--blu)"> Exclude exec salaries</label>';
  if(needPerson){h+='<select id="fPer"><option value="">All People</option>';allPeople.forEach(p=>{h+=`<option value="${p}"${state.person===p?' selected':''}>${p}</option>`});h+='</select>';}
  if(needType){h+='<select id="fTy"><option value="">All Types</option>';allTypes.forEach(t=>{h+=`<option value="${t}"${state.type===t?' selected':''}>${t}</option>`});h+='</select>';}
  if(needSearch)h+=`<input id="fS" placeholder="Search projects..." value="${state.search}">`;
  fb.innerHTML=h;
  document.getElementById('fM').onchange=function(){state.month=this.value;render()};
  document.getElementById('fSens').onchange=function(){state.hideSens=this.checked;render()};
  if(document.getElementById('fPer'))document.getElementById('fPer').onchange=function(){state.person=this.value;render()};
  if(document.getElementById('fTy'))document.getElementById('fTy').onchange=function(){state.type=this.value;render()};
  if(document.getElementById('fS'))document.getElementById('fS').oninput=function(){state.search=this.value.toLowerCase();render()};
}

function fMonthly(){
  let d=D.monthly;
  if(state.hideSens)d=d.filter(r=>!r.s);
  if(state.month)d=d.filter(r=>r.m===state.month);
  if(state.person)d=d.filter(r=>r.p===state.person);
  if(state.type)d=d.filter(r=>r.t===state.type);
  return d;
}

function render(){destroyCharts();buildFilters();const ct=document.getElementById('ct');
  if(state.tab==='overview')renderOverview(ct);
  else if(state.tab==='projects'){if(state.drill)renderProjectDetail(ct,state.drill);else renderProjects(ct)}
  else if(state.tab==='people'){if(state.drill)renderPersonDetail(ct,state.drill);else renderPeople(ct)}
  else if(state.tab==='pillars')renderPillars(ct);
}

  const ms=state.month?[state.month]:months;
  charts.mC=new Chart(document.getElementById('mC'),{type:'bar',data:{labels:ms.map(m=>m.slice(2)),datasets:[

  const crD=ms.map(m=>{const b=byM[m]||{cc:0,nc:0,lc:0};const t=b.cc+b.nc+b.lc;return t>0?b.cc/t:0});
  charts.cC=new Chart(document.getElementById('cC'),{type:'line',data:{labels:ms.map(m=>m.slice(2)),datasets:[{data:crD,borderColor:'#60a5fa',backgroundColor:'rgba(96,165,250,.1)',fill:true,tension:.3,pointRadius:4,pointBackgroundColor:'#60a5fa'}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#94a3b8'},grid:{color:'#1f2b3e'}},y:{min:0,max:1,ticks:{color:'#94a3b8',callback:v=>P(v)},grid:{color:'#1f2b3e'}}}}});

  const byP={};fd.forEach(r=>{if(!byP[r.p])byP[r.p]={tc:0,cc:0,nc:0,lc:0,t:r.t};const b=byP[r.p];b.tc+=r.tc;b.cc+=r.cc;b.nc+=r.nc;b.lc+=(r.lc||0)});

    <div class="cd"><h3>Person Detail (click row)</h3><div class="scr"><table><thead><tr><th>Person</th><th class="r">Cost</th><th class="r">Hours</th><th class="r">Cap Hrs</th><th class="r">Cap%</th><th>Split</th></tr></thead><tbody id="dpT"></tbody></table></div></div>
  </div>
  <div class="cd"><h3>Person × Month</h3><div class="scr" style="max-height:350px"><table><thead><tr><th>Person</th><th>Month</th><th class="r">Cost</th><th class="r">Hours</th><th class="r">Cap Hrs</th><th class="r">Cap%</th></tr></thead><tbody id="dpmT"></tbody></table></div></div>`;

  document.getElementById('goBack').onclick=()=>{state.drill=null;render()};

  // Monthly agg
  const byM={};ppm.forEach(r=>{if(!byM[r.m])byM[r.m]={c:0,h:0,ch:0};byM[r.m].c+=r.c;byM[r.m].h+=r.h;byM[r.m].ch+=r.ch});
  const ms=Object.keys(byM).sort();
  charts.dm=new Chart(document.getElementById('dm'),{type:'bar',data:{labels:ms.map(m=>m.slice(2)),datasets:[
    {label:'Cap',data:ms.map(m=>byM[m].ch),backgroundColor:'#34d399',borderRadius:2},
    {label:'Non-Cap',data:ms.map(m=>byM[m].h-byM[m].ch),backgroundColor:'#f87171',borderRadius:2},
    {label:'Cost',data:ms.map(m=>byM[m].c),type:'line',borderColor:'#60a5fa',yAxisID:'y1',tension:.3,pointRadius:3,pointBackgroundColor:'#60a5fa'}
  ]},options:{responsive:true,plugins:{legend:{labels:{color:'#94a3b8',font:{size:10}}}},scales:{x:{stacked:true,ticks:{color:'#94a3b8'},grid:{color:'#1f2b3e'}},y:{stacked:true,ticks:{color:'#94a3b8'},grid:{color:'#1f2b3e'}},y1:{position:'right',ticks:{color:'#60a5fa',callback:v=>$(v)},grid:{display:false}}}}});

  // Person agg
  const byP={};ppm.forEach(r=>{if(!byP[r.p])byP[r.p]={c:0,h:0,ch:0};byP[r.p].c+=r.c;byP[r.p].h+=r.h;byP[r.p].ch+=r.ch});
  const pp=Object.entries(byP).sort((a,b)=>b[1].c-a[1].c);
  charts.dp=new Chart(document.getElementById('dp'),{type:'bar',data:{labels:pp.map(([p])=>p),datasets:[{data:pp.map(([,v])=>v.c),backgroundColor:'#a78bfa',borderRadius:3}]},options:{indexAxis:'y',responsive:true,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#94a3b8',callback:v=>$(v)},grid:{color:'#1f2b3e'}},y:{ticks:{color:'#94a3b8',font:{size:10}},grid:{display:false}}}}});

  document.getElementById('dmT').innerHTML=ms.map(m=>{const d=byM[m];const r=d.h>0?d.ch/d.h:0;
    return`<tr><td>${m}</td><td class="r">${$(d.c)}</td><td class="r">${Math.round(d.h)}</td><td class="r">${Math.round(d.ch)}</td><td class="r">${d.h>0?P(r):'-'}</td><td>${barSplit(d.ch,d.h-d.ch,0)}</td></tr>`}).join('');

  document.getElementById('dpT').innerHTML=pp.map(([p,d])=>{const r=d.h>0?d.ch/d.h:0;
    return`<tr class="ck" data-p="${p}"><td>${p}${badge(p)}</td><td class="r">${$(d.c)}</td><td class="r">${Math.round(d.h)}</td><td class="r">${Math.round(d.ch)}</td><td class="r">${d.h>0?P(r):'-'}</td><td>${barSplit(d.ch,d.h-d.ch,0)}</td></tr>`}).join('');
  document.querySelectorAll('#dpT tr.ck').forEach(tr=>{tr.onclick=()=>{state.drill=tr.dataset.p;state.tab='people';document.querySelectorAll('.tab').forEach(t=>t.classList.remove('ac'));document.querySelector('[data-t="people"]').classList.add('ac');render()}});

  const rows=[];ppm.forEach(r=>rows.push(r));rows.sort((a,b)=>a.p.localeCompare(b.p)||a.m.localeCompare(b.m));
  document.getElementById('dpmT').innerHTML=rows.map(r=>{const cr=r.h>0?r.ch/r.h:0;
    return`<tr><td>${r.p}</td><td>${r.m}</td><td class="r">${$(r.c)}</td><td class="r">${Math.round(r.h)}</td><td class="r">${Math.round(r.ch)}</td><td class="r">${r.h>0?P(cr):'-'}</td></tr>`}).join('');
}

// ========== PEOPLE LIST ==========
function renderPeople(ct){
  if(state.drill){renderPersonDetail(ct,state.drill);return}
  const fd=fMonthly();
  const byP={};fd.forEach(r=>{if(!byP[r.p])byP[r.p]={tc:0,cc:0,nc:0,lc:0,t:r.t,co:r.co};const b=byP[r.p];b.tc+=r.tc;b.cc+=r.cc;b.nc+=r.nc;b.lc+=(r.lc||0)});
  const pa=Object.entries(byP).sort((a,b)=>b[1].tc-a[1].tc);

  ct.innerHTML=`<div class="kpi-row">
    <div class="kpi"><div class="lb">People</div><div class="vl" style="color:var(--blu)">${pa.length}</div></div>
    <div class="kpi"><div class="lb">Total Cost</div><div class="vl" style="color:var(--blu)">${$(pa.reduce((s,[,v])=>s+v.tc,0))}</div></div>
  </div>
  <div class="cd"><h3>Click any row to see their project breakdown, monthly detail, and leave</h3>
  <div class="scr"><table><thead><tr><th>Person</th><th>Type</th><th>Company</th><th class="r">Total</th><th class="r">Cap</th><th class="r">Non-Cap</th><th class="r">Leave</th><th class="r">Cap%</th><th>Split</th></tr></thead><tbody id="ppT"></tbody></table></div></div>`;

  document.getElementById('ppT').innerHTML=pa.map(([p,d])=>{
    const cr=d.tc>0?d.cc/d.tc:0;
    return`<tr class="ck" data-p="${p}"><td>${p}${badge(p)}</td><td>${d.t}</td><td>${d.co||''}</td><td class="r">${$(d.tc)}</td><td class="r" style="color:var(--grn)">${$(d.cc)}</td><td class="r" style="color:var(--red)">${$(d.nc)}</td><td class="r" style="color:var(--amb)">${$(d.lc)}</td><td class="r">${P(cr)}</td><td>${barSplit(d.cc,d.nc,d.lc)}</td></tr>`;
  }).join('');
  document.querySelectorAll('#ppT tr.ck').forEach(tr=>{tr.onclick=()=>{state.drill=tr.dataset.p;render()}});
}

// ========== PERSON DETAIL ==========
function renderPersonDetail(ct,person){
  let pm=D.monthly.filter(r=>r.p===person);
  if(state.month)pm=pm.filter(r=>r.m===state.month);
  const tc=pm.reduce((s,r)=>s+r.tc,0),cc=pm.reduce((s,r)=>s+r.cc,0),nc=pm.reduce((s,r)=>s+r.nc,0),lc=pm.reduce((s,r)=>s+(r.lc||0),0);
  const cr=tc>0?cc/tc:0;
  const rate=D.rates.find(r=>r.p===person);

  // Project breakdown
  let ppm=D.ppm.filter(r=>r.p===person);
  if(state.month)ppm=ppm.filter(r=>r.m===state.month);
  const byF={};ppm.forEach(r=>{if(!byF[r.f])byF[r.f]={c:0,h:0,ch:0,mos:new Set()};byF[r.f].c+=r.c;byF[r.f].h+=r.h;byF[r.f].ch+=r.ch;byF[r.f].mos.add(r.m)});
  const fa=Object.entries(byF).sort((a,b)=>b[1].c-a[1].c);

  // Leave for this person
  const leave=D.leave.filter(r=>r.n===person||r.n.includes(person.split(' ')[1]||'___NOMATCH'));

  ct.innerHTML=`<div class="back" id="goBack">← People</div>
  <h2 style="margin-bottom:4px;font-size:16px">${person} ${badge(person)}</h2>
  ${rate?`<div style="font-size:11px;color:var(--tx2);margin-bottom:10px">FLM: ${$(rate.flm)}/mo${rate.hr?' · $'+rate.hr.toFixed(2)+'/hr':''}${rate.note?' · '+rate.note:''}</div>`:''}
  ${rate&&rate.bd&&rate.bd.tax?`<div class="cd" style="margin-bottom:10px"><h3>Rate Breakdown (Monthly)</h3><table style="width:auto"><tbody>
    <tr><td style="padding:3px 12px 3px 0">Base Salary</td><td class="r">$${rate.bd.tax.toLocaleString(undefined,{minimumFractionDigits:2})}</td></tr>
    <tr><td style="padding:3px 12px 3px 0">Super (SGC)</td><td class="r">$${rate.bd.sgc.toLocaleString(undefined,{minimumFractionDigits:2})}</td></tr>
    <tr style="border-top:1px solid var(--sf2)"><td style="padding:3px 12px 3px 0;font-weight:600">Base + Super</td><td class="r" style="font-weight:600">$${rate.bd.base.toLocaleString(undefined,{minimumFractionDigits:2})}</td></tr>
    <tr><td style="padding:3px 12px 3px 0">Payroll Tax (5.45%)</td><td class="r">$${rate.bd.pt.toLocaleString(undefined,{minimumFractionDigits:2})}</td></tr>
    <tr><td style="padding:3px 12px 3px 0">Workers Comp (2.5%)</td><td class="r">$${rate.bd.wc.toLocaleString(undefined,{minimumFractionDigits:2})}</td></tr>
    <tr><td style="padding:3px 12px 3px 0">Leave Accrual (7.7%)</td><td class="r">$${rate.bd.lv.toLocaleString(undefined,{minimumFractionDigits:2})}</td></tr>
    <tr><td style="padding:3px 12px 3px 0">Long Service Leave</td><td class="r">$${rate.bd.lsl.toLocaleString(undefined,{minimumFractionDigits:2})}</td></tr>
    <tr style="border-top:1px solid var(--sf2)"><td style="padding:3px 12px 3px 0;font-weight:700;color:var(--acc)">Fully Loaded</td><td class="r" style="font-weight:700;color:var(--acc)">$${rate.bd.total.toLocaleString(undefined,{minimumFractionDigits:2})}</td></tr>
  </tbody></table></div>`:''}
  <div class="kpi-row">
    <div class="kpi"><div class="lb">Total Cost</div><div class="vl" style="color:var(--blu)">${$(tc)}</div></div>
    <div class="kpi"><div class="lb">Capitalised</div><div class="vl" style="color:var(--grn)">${$(cc)}</div><div class="sb"><span class="pill g">${P(cr)}</span></div></div>
    <div class="kpi"><div class="lb">Non-Cap</div><div class="vl" style="color:var(--red)">${$(nc)}</div></div>
    <div class="kpi"><div class="lb">Leave</div><div class="vl" style="color:var(--amb)">${$(lc)}</div></div>
  </div>

  <div class="g2">
    <div class="cd"><h3>Monthly Trajectory</h3><canvas id="pmC"></canvas></div>
    <div class="cd"><h3>Project Allocation (Top 12)</h3><canvas id="ppC"></canvas></div>
  </div>

  <div class="cd"><h3>Project Breakdown (click row to see project detail)</h3><div class="scr"><table><thead><tr>
    <th>Project</th><th class="r">Cost</th><th class="r">% of Total</th><th class="r">Hours</th><th class="r">Cap Hrs</th><th class="r">Cap%</th><th class="r">Months</th><th>Split</th>
  </tr></thead><tbody id="pfT"></tbody></table></div></div>

  <div class="cd"><h3>Monthly Detail</h3><div class="scr"><table><thead><tr>
    <th>Month</th><th class="r">Total</th><th class="r">Cap</th><th class="r">Non-Cap</th><th class="r">Leave</th><th class="r">Cap%</th><th>Split</th>
  </tr></thead><tbody id="pmT"></tbody></table></div></div>

  <div class="cd"><h3>Project × Month</h3><div class="scr" style="max-height:300px"><table><thead><tr>
    <th>Project</th><th>Month</th><th class="r">Cost</th><th class="r">Hours</th><th class="r">Cap Hrs</th><th class="r">Cap%</th>
  </tr></thead><tbody id="pfmT"></tbody></table></div></div>

  ${leave.length>0?`<div class="cd"><h3>Leave Records</h3><div class="scr"><table><thead><tr>
    <th>Category</th><th>Type</th><th>From</th><th>To</th><th class="r">Hours</th>
  </tr></thead><tbody id="lvT"></tbody></table></div></div>`:`<div class="cd"><h3>Leave Records</h3><div class="empty">No leave records found for ${person}</div></div>`}`;

  document.getElementById('goBack').onclick=()=>{state.drill=null;render()};

  // Monthly chart
  const ms=state.month?[state.month]:months;
  const pmMap={};pm.forEach(r=>{pmMap[r.m]=r});
  charts.pmC=new Chart(document.getElementById('pmC'),{type:'bar',data:{labels:ms.map(m=>m.slice(2)),datasets:[
    {label:'Cap',data:ms.map(m=>(pmMap[m]||{}).cc||0),backgroundColor:'#34d399',borderRadius:2},
    {label:'Non-Cap',data:ms.map(m=>(pmMap[m]||{}).nc||0),backgroundColor:'#f87171',borderRadius:2},
    {label:'Leave',data:ms.map(m=>(pmMap[m]||{}).lc||0),backgroundColor:'#fbbf24',borderRadius:2}
  ]},options:{responsive:true,plugins:{legend:{labels:{color:'#94a3b8',font:{size:10}}}},scales:{x:{stacked:true,ticks:{color:'#94a3b8'},grid:{color:'#1f2b3e'}},y:{stacked:true,ticks:{color:'#94a3b8',callback:v=>$(v)},grid:{color:'#1f2b3e'}}}}});

  // Project pie
  const top12=fa.filter(([f])=>f!=='Unclassified').slice(0,12);
  const colors=['#60a5fa','#34d399','#f87171','#fbbf24','#a78bfa','#38bdf8','#fb923c','#e879f9','#4ade80','#f472b6','#22d3ee','#818cf8'];
  charts.ppC=new Chart(document.getElementById('ppC'),{type:'doughnut',data:{labels:top12.map(([f])=>f.length>22?f.slice(0,22)+'…':f),datasets:[{data:top12.map(([,v])=>v.c),backgroundColor:colors}]},options:{responsive:true,plugins:{legend:{position:'right',labels:{color:'#94a3b8',font:{size:9},boxWidth:10}}}}});

  // Project table
  const ptc=fa.reduce((s,[,v])=>s+v.c,0);
  document.getElementById('pfT').innerHTML=fa.map(([f,v])=>{
    const cr=v.h>0?v.ch/v.h:0;
    return`<tr class="ck" data-f="${f.replace(/"/g,'&quot;')}"><td>${f}</td><td class="r">${$(v.c)}</td><td class="r">${ptc>0?(v.c/ptc*100).toFixed(1)+'%':'-'}</td><td class="r">${Math.round(v.h)}</td><td class="r">${Math.round(v.ch)}</td><td class="r">${v.h>0?P(cr):'-'}</td><td class="r">${v.mos.size}</td><td>${barSplit(v.ch,v.h-v.ch,0)}</td></tr>`;
  }).join('');
  document.querySelectorAll('#pfT tr.ck').forEach(tr=>{tr.onclick=()=>{state.drill=tr.dataset.f;state.tab='projects';document.querySelectorAll('.tab').forEach(t=>t.classList.remove('ac'));document.querySelector('[data-t="projects"]').classList.add('ac');render()}});

  // Monthly table
  document.getElementById('pmT').innerHTML=ms.map(m=>{const d=pmMap[m];if(!d)return'';
    const cr=d.tc>0?d.cc/d.tc:0;
    return`<tr><td>${m}</td><td class="r">${$(d.tc)}</td><td class="r" style="color:var(--grn)">${$(d.cc)}</td><td class="r" style="color:var(--red)">${$(d.nc)}</td><td class="r" style="color:var(--amb)">${$(d.lc)}</td><td class="r">${P(cr)}</td><td>${barSplit(d.cc,d.nc,d.lc)}</td></tr>`}).join('');

  // Project x month
  const pfm=[];ppm.forEach(r=>pfm.push(r));pfm.sort((a,b)=>a.f.localeCompare(b.f)||a.m.localeCompare(b.m));
  document.getElementById('pfmT').innerHTML=pfm.map(r=>{const cr=r.h>0?r.ch/r.h:0;
    return`<tr><td>${r.f}</td><td>${r.m}</td><td class="r">${$(r.c)}</td><td class="r">${Math.round(r.h)}</td><td class="r">${Math.round(r.ch)}</td><td class="r">${r.h>0?P(cr):'-'}</td></tr>`}).join('');

  // Leave table
  if(leave.length>0){
    document.getElementById('lvT').innerHTML=leave.map(r=>`<tr><td>${r.cat}</td><td>${r.type}</td><td>${r.from}</td><td>${r.to}</td><td class="r">${r.hrs}</td></tr>`).join('');
  }
}

// ========== PILLARS ==========
function renderPillars(ct){
  let pd=D.pillar;
  if(state.hideSens)pd=pd.filter(r=>!r.s);
  if(state.month)pd=pd.filter(r=>r.m===state.month);
  if(state.person)pd=pd.filter(r=>r.p===state.person);
  const pis={};
  pd.forEach(r=>{if(!pis[r.pi])pis[r.pi]={c:0,h:0,ch:0};pis[r.pi].c+=r.c;pis[r.pi].h+=r.h;pis[r.pi].ch+=r.ch});
  const pa=Object.entries(pis).sort((a,b)=>b[1].c-a[1].c);
  const tc=pa.reduce((s,[,v])=>s+v.c,0);

  ct.innerHTML=`<div class="g2"><div class="cd"><h3>Hours by Pillar</h3><canvas id="piC"></canvas></div><div class="cd"><h3>Cost by Pillar</h3><canvas id="piC2"></canvas></div></div>
  <div class="cd"><h3>Pillar Detail</h3><div class="scr"><table><thead><tr><th>Pillar</th><th class="r">Cost</th><th class="r">%</th><th class="r">Hours</th><th class="r">Cap Hrs</th><th class="r">Cap%</th></tr></thead><tbody id="piT"></tbody></table></div></div>`;

  const colors=['#60a5fa','#34d399','#f87171','#fbbf24','#a78bfa','#38bdf8','#fb923c','#e879f9','#4ade80','#f472b6','#22d3ee','#818cf8','#facc15','#2dd4bf'];
  const top14=pa.slice(0,14);
  charts.piC=new Chart(document.getElementById('piC'),{type:'doughnut',data:{labels:top14.map(([p])=>p.length>25?p.slice(0,25)+'…':p),datasets:[{data:top14.map(([,v])=>v.h),backgroundColor:colors}]},options:{responsive:true,plugins:{legend:{position:'right',labels:{color:'#94a3b8',font:{size:10}}}}}});
  charts.piC2=new Chart(document.getElementById('piC2'),{type:'doughnut',data:{labels:top14.map(([p])=>p.length>25?p.slice(0,25)+'…':p),datasets:[{data:top14.map(([,v])=>v.c),backgroundColor:colors}]},options:{responsive:true,plugins:{legend:{position:'right',labels:{color:'#94a3b8',font:{size:10}}}}}});

  document.getElementById('piT').innerHTML=pa.map(([p,d])=>{const cr=d.h>0?d.ch/d.h:0;const isNew=p==='General Capitalisation (Executive)';
    return`<tr><td>${p}${isNew?'<span class="badge">NEW</span>':''}</td><td class="r">${$(d.c)}</td><td class="r">${tc>0?(d.c/tc*100).toFixed(1)+'%':'-'}</td><td class="r">${Math.round(d.h)}</td><td class="r">${Math.round(d.ch)}</td><td class="r">${d.h>0?P(cr):'-'}</td></tr>`}).join('');
}

render();
</script></body></html>
