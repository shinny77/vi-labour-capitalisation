const $=v=>'$'+Math.round(v).toLocaleString();
const P=v=>(v*100).toFixed(1)+'%';
const months=[...new Set(D.monthly.map(r=>r.m))].sort();
const allPeople=[...new Set(D.monthly.map(r=>r.p))].sort();
const allTypes=[...new Set(D.monthly.map(r=>r.t))].sort();
const NEW=['Robin (CEO)','Joe (COO)','Andres Puricelli','Michael Truong','Sam Rumble'];
const SENS=['Robin (CEO)','Joe (COO)','Andres Puricelli'];
const charts={};
let state={tab:'overview',month:'',person:'',type:'',search:'',sort:'tc',asc:false,drill:null,hideSens:false};

function destroyCharts(){Object.values(charts).forEach(c=>{try{c.destroy()}catch(e){}});for(let k in charts)delete charts[k]}
function badge(p){return NEW.includes(p)?'<span class="badge">NEW</span>':''}
function barSplit(cap,noncap,leave){
  const t=cap+noncap+leave;if(t===0)return'<div class="bar"><div class="g" style="width:100%"></div></div>';
  return`<div class="bar"><div class="g" style="width:${cap/t*100}%"></div><div class="rd" style="width:${noncap/t*100}%"></div><div class="am" style="width:${leave/t*100}%"></div></div>`;
}

function setTab(t){state.tab=t;state.drill=null;state.search='';render()}
document.getElementById('tabs').onclick=e=>{if(!e.target.classList.contains('tab'))return;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('ac'));e.target.classList.add('ac');setTab(e.target.dataset.t)};

function buildFilters(){
  const fb=document.getElementById('fltBar');
  const needMonth=true,needPerson=['overview','pillars'].includes(state.tab),needType=['overview'].includes(state.tab),needSearch=['projects'].includes(state.tab)&&!state.drill;
  let h='<select id="fM"><option value="">All Months</option>';
  months.forEach(m=>{h+=`<option value="${m}"${state.month===m?' selected':''}>${m}</option>`});
  h+='</select>';
  h+='<label style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--tx2);cursor:pointer;background:var(--sf);border:1px solid var(--sf2);padding:4px 10px;border-radius:6px"><input type="checkbox" id="fSens"'+(state.hideSens?' checked':'')+' style="accent-color:var(--blu)"> Exclude exec salaries</label>';
  
  if(needPerson){h+='<select id="fPer"><option value="">All People</option>';allPeople.forEach(p=>{h+=`<option value="${p}"${state.person===p?' selected':''}>${p}</option>`});h+='</select>';}
  if(needType){h+='<select id="fTy"><option value="">All Types</option>';allTypes.forEach(t=>{h+=`<option value="${t}"${state.type===t?' selected':''}>${t}</option>`});h+='</select>';}
  if(needSearch)h+=`<input id="fS" placeholder="Search projects..." value="${state.search}">`;
  fb.innerHTML=h;
  document.getElementById('fM').onchange=function(){state.month=this.value;render()};
  document.getElementById('fSens').onchange=function(){state.hideSens=this.checked;render()};
  if(document.getElementById('fPer'))document.getElementById('fPer').onchange=function(){state.person=this.value;render()};
  if(document.getElementById('fTy'))document.getElementById('fTy').onchange=function(){state.type=this.value;render()};
  if(document.getElementById('fS'))document.getElementById('fS').oninput=function(){state.search=this.value.toLowerCase();render()};
}

function fMonthly(){
  let d=D.monthly;
  if(state.hideSens)d=d.filter(r=>!r.s);
  if(state.month)d=d.filter(r=>r.m===state.month);
  if(state.person)d=d.filter(r=>r.p===state.person);
  if(state.type)d=d.filter(r=>r.t===state.type);
  return d;
}

function render(){destroyCharts();buildFilters();const ct=document.getElementById('ct');
  if(state.tab==='overview')renderOverview(ct);
  else if(state.tab==='projects'){if(state.drill)renderProjectDetail(ct,state.drill);else renderProjects(ct)}
  else if(state.tab==='people'){if(state.drill)renderPersonDetail(ct,state.drill);else renderPeople(ct)}
  else if(state.tab==='pillars')renderPillars(ct);
}

// ========== OVERVIEW ==========
function renderOverview(ct){
  const fd=fMonthly();
  const tc=fd.reduce((s,r)=>s+r.tc,0),cc=fd.reduce((s,r)=>s+r.cc,0),nc=fd.reduce((s,r)=>s+r.nc,0),lc=fd.reduce((s,r)=>s+(r.lc||0),0);
  const cr=tc>0?cc/tc:0;
  ct.innerHTML=`<div class="kpi-row">
    <div class="kpi"><div class="lb">Total Cost</div><div class="vl" style="color:var(--blu)">${$(tc)}</div></div>
    <div class="kpi"><div class="lb">Capitalised</div><div class="vl" style="color:var(--grn)">${$(cc)}</div><div class="sb"><span class="pill g">${P(cr)}</span></div></div>
    <div class="kpi"><div class="lb">Non-Cap</div><div class="vl" style="color:var(--red)">${$(nc)}</div></div>
    <div class="kpi"><div class="lb">Leave</div><div class="vl" style="color:var(--amb)">${$(lc)}</div></div>
  </div>
  <div class="g2"><div class="cd"><h3>Monthly Breakdown</h3><canvas id="mC"></canvas></div><div class="cd"><h3>Cap Rate Trend</h3><canvas id="cC"></canvas></div></div>
  <div class="cd"><h3>Person Summary</h3><div class="scr"><table><thead><tr><th>Person</th><th>Type</th><th class="r">Total</th><th class="r">Cap</th><th class="r">Non-Cap</th><th class="r">Leave</th><th class="r">Cap%</th><th>Split</th></tr></thead><tbody id="pT"></tbody></table></div></div>`;

  const byM={};months.forEach(m=>{byM[m]={cc:0,nc:0,lc:0}});
  fd.forEach(r=>{if(byM[r.m]){byM[r.m].cc+=r.cc;byM[r.m].nc+=r.nc;byM[r.m].lc+=(r.lc||0)}});
  const ms=state.month?[state.month]:months;
  charts.mC=new Chart(document.getElementById('mC'),{type:'bar',data:{labels:ms.map(m=>m.slice(2)),datasets:[
    {label:'Cap',data:ms.map(m=>(byM[m]||{}).cc||0),backgroundColor:'#34d399',borderRadius:2},
    {label:'Non-Cap',data:ms.map(m=>(byM[m]||{}).nc||0),backgroundColor:'#f87171',borderRadius:2},
    {label:'Leave',data:ms.map(m=>(byM[m]||{}).lc||0),backgroundColor:'#fbbf24',borderRadius:2}
  ]},options:{responsive:true,plugins:{legend:{labels:{color:'#94a3b8',font:{size:10}}}},scales:{x:{stacked:true,ticks:{color:'#94a3b8'},grid:{color:'#1f2b3e'}},y:{stacked:true,ticks:{color:'#94a3b8',callback:v=>$(v)},grid:{color:'#1f2b3e'}}}}});

  const crD=ms.map(m=>{const b=byM[m]||{cc:0,nc:0,lc:0};const t=b.cc+b.nc+b.lc;return t>0?b.cc/t:0});
  charts.cC=new Chart(document.getElementById('cC'),{type:'line',data:{labels:ms.map(m=>m.slice(2)),datasets:[{data:crD,borderColor:'#60a5fa',backgroundColor:'rgba(96,165,250,.1)',fill:true,tension:.3,pointRadius:4,pointBackgroundColor:'#60a5fa'}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#94a3b8'},grid:{color:'#1f2b3e'}},y:{min:0,max:1,ticks:{color:'#94a3b8',callback:v=>P(v)},grid:{color:'#1f2b3e'}}}}});

  const byP={};fd.forEach(r=>{if(!byP[r.p])byP[r.p]={tc:0,cc:0,nc:0,lc:0,t:r.t};const b=byP[r.p];b.tc+=r.tc;b.cc+=r.cc;b.nc+=r.nc;b.lc+=(r.lc||0)});
  const pa=Object.entries(byP).sort((a,b)=>b[1].tc-a[1].tc);
  document.getElementById('pT').innerHTML=pa.map(([p,d])=>{
    const cr=d.tc>0?d.cc/d.tc:0;
    return`<tr class="ck" data-p="${p}"><td>${p}${badge(p)}</td><td>${d.t}</td><td class="r">${$(d.tc)}</td><td class="r" style="color:var(--grn)">${$(d.cc)}</td><td class="r" style="color:var(--red)">${$(d.nc)}</td><td class="r" style="color:var(--amb)">${$(d.lc)}</td><td class="r">${P(cr)}</td><td>${barSplit(d.cc,d.nc,d.lc)}</td></tr>`;
  }).join('');
  document.querySelectorAll('#pT tr.ck').forEach(tr=>{tr.onclick=()=>{state.drill=tr.dataset.p;state.tab='people';document.querySelectorAll('.tab').forEach(t=>t.classList.remove('ac'));document.querySelector('[data-t="people"]').classList.add('ac');render()}});
}

  const pis={};
  pd.forEach(r=>{if(!pis[r.pi])pis[r.pi]={c:0,h:0,ch:0};pis[r.pi].c+=r.c;pis[r.pi].h+=r.h;pis[r.pi].ch+=r.ch});
  const pa=Object.entries(pis).sort((a,b)=>b[1].c-a[1].c);
  const tc=pa.reduce((s,[,v])=>s+v.c,0);

  ct.innerHTML=`<div class="g2"><div class="cd"><h3>Hours by Pillar</h3><canvas id="piC"></canvas></div><div class="cd"><h3>Cost by Pillar</h3><canvas id="piC2"></canvas></div></div>
  <div class="cd"><h3>Pillar Detail</h3><div class="scr"><table><thead><tr><th>Pillar</th><th class="r">Cost</th><th class="r">%</th><th class="r">Hours</th><th class="r">Cap Hrs</th><th class="r">Cap%</th></tr></thead><tbody id="piT"></tbody></table></div></div>`;

  const colors=['#60a5fa','#34d399','#f87171','#fbbf24','#a78bfa','#38bdf8','#fb923c','#e879f9','#4ade80','#f472b6','#22d3ee','#818cf8','#facc15','#2dd4bf'];
  const top14=pa.slice(0,14);
  charts.piC=new Chart(document.getElementById('piC'),{type:'doughnut',data:{labels:top14.map(([p])=>p.length>25?p.slice(0,25)+'…':p),datasets:[{data:top14.map(([,v])=>v.h),backgroundColor:colors}]},options:{responsive:true,plugins:{legend:{position:'right',labels:{color:'#94a3b8',font:{size:10}}}}}});
  charts.piC2=new Chart(document.getElementById('piC2'),{type:'doughnut',data:{labels:top14.map(([p])=>p.length>25?p.slice(0,25)+'…':p),datasets:[{data:top14.map(([,v])=>v.c),backgroundColor:colors}]},options:{responsive:true,plugins:{legend:{position:'right',labels:{color:'#94a3b8',font:{size:10}}}}}});

  document.getElementById('piT').innerHTML=pa.map(([p,d])=>{const cr=d.h>0?d.ch/d.h:0;const isNew=p==='General Capitalisation (Executive)';
    return`<tr><td>${p}${isNew?'<span class="badge">NEW</span>':''}</td><td class="r">${$(d.c)}</td><td class="r">${tc>0?(d.c/tc*100).toFixed(1)+'%':'-'}</td><td class="r">${Math.round(d.h)}</td><td class="r">${Math.round(d.ch)}</td><td class="r">${d.h>0?P(cr):'-'}</td></tr>`}).join('');
}

render();
</script></body></html>
