  if(needPerson){h+='<select id="fPer"><option value="">All People</option>';allPeople.forEach(p=>{h+=`<option value="${p}"${state.person===p?' selected':''}>${p}</option>`});h+='</select>';}
  if(needType){h+='<select id="fTy"><option value="">All Types</option>';allTypes.forEach(t=>{h+=`<option value="${t}"${state.type===t?' selected':''}>${t}</option>`});h+='</select>';}
  if(needSearch)h+=`<input id="fS" placeholder="Search projects..." value="${state.search}">`;
  fb.innerHTML=h;
  document.getElementById('fM').onchange=function(){state.month=this.value;render()};
  if(document.getElementById('fPer'))document.getElementById('fPer').onchange=function(){state.person=this.value;render()};
  if(document.getElementById('fTy'))document.getElementById('fTy').onchange=function(){state.type=this.value;render()};
  if(document.getElementById('fS'))document.getElementById('fS').oninput=function(){state.search=this.value.toLowerCase();render()};
}

function fMonthly(){
  let d=D.monthly;
  if(state.month)d=d.filter(r=>r.m===state.month);
  if(state.person)d=d.filter(r=>r.p===state.person);
  if(state.type)d=d.filter(r=>r.t===state.type);
  return d;
}

function render(){destroyCharts();buildFilters();const ct=document.getElementById('ct');
  if(state.tab==='overview')renderOverview(ct);

    {label:'Cap',data:ms.map(m=>(pmMap[m]||{}).cc||0),backgroundColor:'#34d399',borderRadius:2},
    {label:'Non-Cap',data:ms.map(m=>(pmMap[m]||{}).nc||0),backgroundColor:'#f87171',borderRadius:2},
    {label:'Leave',data:ms.map(m=>(pmMap[m]||{}).lc||0),backgroundColor:'#fbbf24',borderRadius:2}
  ]},options:{responsive:true,plugins:{legend:{labels:{color:'#94a3b8',font:{size:10}}}},scales:{x:{stacked:true,ticks:{color:'#94a3b8'},grid:{color:'#1f2b3e'}},y:{stacked:true,ticks:{color:'#94a3b8',callback:v=>$(v)},grid:{color:'#1f2b3e'}}}}});

  // Project pie
  const top12=fa.filter(([f])=>f!=='Unclassified').slice(0,12);
  const colors=['#60a5fa','#34d399','#f87171','#fbbf24','#a78bfa','#38bdf8','#fb923c','#e879f9','#4ade80','#f472b6','#22d3ee','#818cf8'];
  charts.ppC=new Chart(document.getElementById('ppC'),{type:'doughnut',data:{labels:top12.map(([f])=>f.length>22?f.slice(0,22)+'…':f),datasets:[{data:top12.map(([,v])=>v.c),backgroundColor:colors}]},options:{responsive:true,plugins:{legend:{position:'right',labels:{color:'#94a3b8',font:{size:9},boxWidth:10}}}}});

  // Project table
  const ptc=fa.reduce((s,[,v])=>s+v.c,0);
  document.getElementById('pfT').innerHTML=fa.map(([f,v])=>{
    const cr=v.h>0?v.ch/v.h:0;
    return`<tr class="ck" data-f="${f.replace(/"/g,'&quot;')}"><td>${f}</td><td class="r">${$(v.c)}</td><td class="r">${ptc>0?(v.c/ptc*100).toFixed(1)+'%':'-'}</td><td class="r">${Math.round(v.h)}</td><td class="r">${Math.round(v.ch)}</td><td class="r">${v.h>0?P(cr):'-'}</td><td class="r">${v.mos.size}</td><td>${barSplit(v.ch,v.h-v.ch,0)}</td></tr>`;
  }).join('');
  document.querySelectorAll('#pfT tr.ck').forEach(tr=>{tr.onclick=()=>{state.drill=tr.dataset.f;state.tab='projects';document.querySelectorAll('.tab').forEach(t=>t.classList.remove('ac'));document.querySelector('[data-t="projects"]').classList.add('ac');render()}});

  // Monthly table
  document.getElementById('pmT').innerHTML=ms.map(m=>{const d=pmMap[m];if(!d)return'';
    const cr=d.tc>0?d.cc/d.tc:0;
    return`<tr><td>${m}</td><td class="r">${$(d.tc)}</td><td class="r" style="color:var(--grn)">${$(d.cc)}</td><td class="r" style="color:var(--red)">${$(d.nc)}</td><td class="r" style="color:var(--amb)">${$(d.lc)}</td><td class="r">${P(cr)}</td><td>${barSplit(d.cc,d.nc,d.lc)}</td></tr>`}).join('');

  // Project x month
  const pfm=[];ppm.forEach(r=>pfm.push(r));pfm.sort((a,b)=>a.f.localeCompare(b.f)||a.m.localeCompare(b.m));
  document.getElementById('pfmT').innerHTML=pfm.map(r=>{const cr=r.h>0?r.ch/r.h:0;
    return`<tr><td>${r.f}</td><td>${r.m}</td><td class="r">${$(r.c)}</td><td class="r">${Math.round(r.h)}</td><td class="r">${Math.round(r.ch)}</td><td class="r">${r.h>0?P(cr):'-'}</td></tr>`}).join('');

  // Leave table
  if(leave.length>0){
    document.getElementById('lvT').innerHTML=leave.map(r=>`<tr><td>${r.cat}</td><td>${r.type}</td><td>${r.from}</td><td>${r.to}</td><td class="r">${r.hrs}</td></tr>`).join('');
  }
}

// ========== PILLARS ==========
function renderPillars(ct){
  let pd=D.pillar;
  if(state.month)pd=pd.filter(r=>r.m===state.month);
  if(state.person)pd=pd.filter(r=>r.p===state.person);
  const pis={};
  pd.forEach(r=>{if(!pis[r.pi])pis[r.pi]={c:0,h:0,ch:0};pis[r.pi].c+=r.c;pis[r.pi].h+=r.h;pis[r.pi].ch+=r.ch});
  const pa=Object.entries(pis).sort((a,b)=>b[1].c-a[1].c);
  const tc=pa.reduce((s,[,v])=>s+v.c,0);

  ct.innerHTML=`<div class="g2"><div class="cd"><h3>Hours by Pillar</h3><canvas id="piC"></canvas></div><div class="cd"><h3>Cost by Pillar</h3><canvas id="piC2"></canvas></div></div>
  <div class="cd"><h3>Pillar Detail</h3><div class="scr"><table><thead><tr><th>Pillar</th><th class="r">Cost</th><th class="r">%</th><th class="r">Hours</th><th class="r">Cap Hrs</th><th class="r">Cap%</th></tr></thead><tbody id="piT"></tbody></table></div></div>`;

  const colors=['#60a5fa','#34d399','#f87171','#fbbf24','#a78bfa','#38bdf8','#fb923c','#e879f9','#4ade80','#f472b6','#22d3ee','#818cf8','#facc15','#2dd4bf'];
  const top14=pa.slice(0,14);
  charts.piC=new Chart(document.getElementById('piC'),{type:'doughnut',data:{labels:top14.map(([p])=>p.length>25?p.slice(0,25)+'…':p),datasets:[{data:top14.map(([,v])=>v.h),backgroundColor:colors}]},options:{responsive:true,plugins:{legend:{position:'right',labels:{color:'#94a3b8',font:{size:10}}}}}});
  charts.piC2=new Chart(document.getElementById('piC2'),{type:'doughnut',data:{labels:top14.map(([p])=>p.length>25?p.slice(0,25)+'…':p),datasets:[{data:top14.map(([,v])=>v.c),backgroundColor:colors}]},options:{responsive:true,plugins:{legend:{position:'right',labels:{color:'#94a3b8',font:{size:10}}}}}});

  document.getElementById('piT').innerHTML=pa.map(([p,d])=>{const cr=d.h>0?d.ch/d.h:0;const isNew=p==='General Capitalisation (Executive)';
    return`<tr><td>${p}${isNew?'<span class="badge">NEW</span>':''}</td><td class="r">${$(d.c)}</td><td class="r">${tc>0?(d.c/tc*100).toFixed(1)+'%':'-'}</td><td class="r">${Math.round(d.h)}</td><td class="r">${Math.round(d.ch)}</td><td class="r">${d.h>0?P(cr):'-'}</td></tr>`}).join('');
}

render();
</script></body></html>
